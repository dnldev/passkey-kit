# nightly.yml (ci-ok-standard) — the long mutation job, moved out of ci.yml: fast gates on PR, long jobs nightly
# (Daniel's choice for the reader, neverending-reader #37). Stryker never runs on a PR, and agent-gate, which re-runs
# ci.yml's steps on the host, no longer runs it either. The job below is the one ci.yml carried, unchanged but for its
# `needs:`. Not copied from the reader: its `select` / `nightly-ok` status (cosmere tools/nightly, ci-tiers SPEC §4).
name: nightly

on:
  schedule:
    - cron: "10 2 * * *"   # estate stagger: 20 minutes per repo inside 00:30-03:30Z
  workflow_dispatch:

jobs:
  mutation:
    name: Mutation Tests (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Stryker mutation tests
        run: npm run test:mutate
      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
