name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: [self-hosted, cosmere]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint packages/*/src/

      - name: Typecheck (server)
        run: npx tsc -p packages/server/tsconfig.json --noEmit

      - name: Typecheck (client)
        run: npx tsc -p packages/client/tsconfig.json --noEmit

      - name: Test
        run: npm test

  mutation:
    name: Mutation Tests (Stryker)
    runs-on: [self-hosted, cosmere]
    needs: [ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Stryker mutation tests
        run: npm run test:mutate
      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
